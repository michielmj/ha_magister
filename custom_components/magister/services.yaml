set_homework_progress:
  target:
    entity:
      integration: magister
      domain: todo
  fields:
    item:
      required: true
      example: "myschool.magister.net:1001:100001"
      selector:
        text:
    progress:
      required: true
      example: 50
      selector:
        number:
          min: 0
          max: 100
          step: 25
          unit_of_measurement: "%"
          mode: slider

add_homework_label:
  target:
    entity:
      integration: magister
      domain: todo
  fields:
    appointment:
      required: true
      example: "myschool.magister.net:1001:100070"
      selector:
        text:
    label:
      required: true
      example: "Toetsweek"
      selector:
        text:
    note:
      required: false
      example: "H3 + H4"
      selector:
        text:

remove_homework_label:
  target:
    entity:
      integration: magister
      domain: todo
  fields:
    appointment:
      required: true
      example: "myschool.magister.net:1001:100070"
      selector:
        text:
    label:
      required: true
      example: "Toetsweek"
      selector:
        text:

set_homework_override:
  target:
    entity:
      integration: magister
      domain: todo
  fields:
    appointment:
      required: true
      example: "myschool.magister.net:1001:100070"
      selector:
        text:
    mode:
      required: true
      example: "replace"
      selector:
        select:
          translation_key: homework_override_mode
          options:
            - replace
            - disable
            - clear
    label:
      required: false
      example: "Huiswerk"
      selector:
        text:
