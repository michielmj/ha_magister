[project]
name = "ha-magister"
version = "1.1.0"
description = "Home Assistant custom integration for the Magister school agenda"
requires-python = ">=3.14"
license = "MIT"

[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = ["docs/reference"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
warn_unused_ignores = true
files = ["custom_components/magister", "tools"]

[[tool.mypy.overrides]]
module = "custom_components.magister.api.*"
strict = true
