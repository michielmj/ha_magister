name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please do not include names, usernames, passwords or screenshots that show personal data.
  - type: textarea
    id: problem
    attributes:
      label: What do you want to achieve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like the integration to do?
