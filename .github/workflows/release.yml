name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check the tag against the manifest version
        run: |
          version=$(python3 -c "import json; print(json.load(open('custom_components/magister/manifest.json'))['version'])")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match manifest version v${version}" >&2
            exit 1
          fi
          py=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v${py}" != "${GITHUB_REF_NAME}" ]; then
            echo "pyproject.toml version ${py} does not match tag ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          if ! grep -q "\"ha-magister/${version}[ \"]" custom_components/magister/api/auth.py; then
            echo "USER_AGENT in api/auth.py does not match ${version}" >&2
            exit 1
          fi
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: pip install -r requirements_test.txt
      - run: pytest --cov=custom_components.magister --cov-fail-under=90

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Extract the CHANGELOG section
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## " { if (found) exit; if ($2 == v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "No CHANGELOG section for ${version}" >&2
            exit 1
          fi
      - name: Create the GitHub release
        # v2.6.2
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3
        with:
          body_path: release_notes.md
