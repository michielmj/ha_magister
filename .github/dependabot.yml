version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The Home Assistant baseline is bumped by hand (see docs/plan/release.md).
      - dependency-name: pytest-homeassistant-custom-component
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    ignore:
      # typescript-eslint does not support TypeScript 7 yet.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      frontend-dev-dependencies:
        dependency-type: development
